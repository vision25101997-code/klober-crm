:root{
  --brand:#16C47F; --brand-h:#0FA968; --brand-d:#16C47F; --brand-l:rgba(22,196,127,.12); --brand-ll:rgba(22,196,127,.06); --brand-ring:rgba(22,196,127,.35); --on-brand:#04140D;
  --ink:#F4F4F5; --ink2:#C4C4C8; --mute:#8B8B92; --line:#26262A; --bg:#0A0A0A; --card:#141416; --card2:#1B1B1E;
  --ok:#22C55E; --warn:#F5B323; --gray:#9AA0A6; --blue:#4C8DFF;
  --r:16px; --sh:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
  --font:"Rubik","Heebo","Assistant","Segoe UI","Noto Sans Hebrew","Arial Hebrew",Arial,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--brand-d);text-decoration:none} a:hover{color:var(--brand-h);text-decoration:underline}
bdi.ltr{direction:ltr;unicode-bidi:isolate}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header */
header.top{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.82);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;white-space:nowrap}
.brand img{height:30px;display:block}
.brand .sub{font-weight:500;color:var(--mute);font-size:13px;border-inline-start:1px solid var(--line);padding-inline-start:10px}
nav.tabs{display:flex;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px;margin-inline-start:auto}
nav.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:8px;white-space:nowrap}
nav.tabs button .n{font-size:12px;background:var(--line);color:var(--ink2);border-radius:999px;padding:0 8px;min-width:22px;text-align:center}
nav.tabs button[aria-selected=true]{background:var(--brand);color:var(--on-brand)}
nav.tabs button[aria-selected=true]:hover{background:var(--brand-h)}
nav.tabs button[aria-selected=true] .n{background:rgba(4,20,13,.18);color:var(--on-brand)}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--gray);display:inline-block}
.sync.server i,.sync.ghpages i{background:var(--ok)} .sync.local i{background:var(--warn)}
.expbtn{border:1px solid var(--brand);background:var(--brand-l);color:var(--brand-d);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,color .15s}
.expbtn:hover{background:var(--brand);color:var(--on-brand)}
.addbtn{border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.addbtn:hover{background:var(--brand-h)}
.shmodal-bg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.76);backdrop-filter:blur(6px);display:none;place-items:center;padding:16px}
.shmodal-bg.open{display:grid}
.shmodal{width:100%;max-width:440px;background:var(--card);border:1.5px solid var(--brand);border-radius:20px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.6);display:grid;gap:12px}
.shmodal h3{margin:0;font-size:18px;display:flex;align-items:center;justify-content:space-between}
.shmodal h3 button{border:0;background:transparent;color:var(--mute);font-size:20px;padding:0 4px}
.shmodal label{font-size:12px;font-weight:700;color:var(--ink2);display:block;margin-bottom:4px}
.shmodal input,.shmodal select,.shmodal textarea{width:100%;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:10px;padding:9px 11px;font:inherit;font-size:15px}
.shmodal .shbtns{display:flex;gap:8px;margin-top:4px}
.shmodal .shsave{flex:1;border:0;background:var(--brand);color:var(--on-brand);border-radius:12px;padding:10px 14px;font-weight:800;font-size:15px}
.shmodal .shcancel{border:1px solid var(--line);background:var(--card2);color:var(--ink2);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}

/* hero */
.hero{padding:28px 0 8px}
.hero h1{margin:0;font-size:30px;letter-spacing:-.5px;line-height:1.2}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero p{margin:6px 0 0;color:var(--ink2);max-width:760px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 6px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{border-color:var(--brand);background:var(--brand-l);color:var(--brand-d)}
.cfil{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;padding:8px 10px;border:2px solid #16C47F;border-radius:14px;background:#16C47F0F}
.cfil .lbl{font-weight:800;color:#0E9F66;font-size:13px;margin-inline-end:4px}
.cfil .chip[aria-pressed=true]{background:#16C47F;border-color:#16C47F;color:var(--on-brand)}
.cmail{display:flex;flex-wrap:wrap;gap:10px;padding:0 14px 8px;font-size:13px}
.cmail a{color:#0E9F66;font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%}
.sel,.search{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font:inherit;font-size:13px;color:var(--ink)}
.search{min-width:200px;flex:1}
.sep{width:1px;height:24px;background:var(--line)}
.count{font-size:13px;color:var(--mute);margin-inline-start:auto;white-space:nowrap}

/* groups */
.group{margin:22px 0}
.group h2{font-size:14px;font-weight:700;color:var(--ink2);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.group h2::after{content:"";flex:1;height:1px;background:var(--line)}
.group h2 .b{background:var(--brand);color:var(--on-brand);border-radius:999px;font-size:12px;padding:1px 9px}

/* influencer cards */
.list{display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;transition:border-color .15s}
.card:hover{border-color:#3A3A40}
.card.open{border-color:var(--brand)}
.row{display:grid;grid-template-columns:44px minmax(0,1.6fr) minmax(0,1.3fr) auto auto auto 20px;gap:14px;align-items:center;padding:12px 16px;cursor:pointer;width:100%;background:none;border:0;text-align:start;color:inherit}
.av{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-h));color:var(--on-brand);font-weight:800;display:grid;place-items:center;font-size:18px}
.who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--mute);font-size:13px}
.who .mst{display:none;margin-top:4px;gap:6px;align-items:center}
.who .mst .fit{font-size:11px;padding:2px 7px}
.niche{color:var(--ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fol{font-weight:700;font-size:15px;white-space:nowrap;text-align:center}
.fol small{display:block;font-weight:500;font-size:11px;color:var(--mute)}
.fit{font-weight:800;font-size:13px;border-radius:10px;padding:4px 9px;white-space:nowrap}
.fit.hi{background:var(--brand);color:var(--on-brand)} .fit.md{background:var(--brand-l);color:var(--brand-d)} .fit.lo{background:#26262A;color:var(--ink2)}
.st{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.st .dot{width:7px;height:7px;border-radius:50%}
.chev{transition:transform .2s;color:var(--mute)} .open .chev{transform:rotate(180deg)}
.tag{font-size:11px;font-weight:700;color:var(--ok);background:rgba(34,197,94,.14);border-radius:6px;padding:2px 6px;white-space:nowrap}

.det{display:none;border-top:1px dashed var(--line);padding:16px;background:linear-gradient(var(--brand-ll),var(--card) 140px)}
.open .det{display:block}
.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 22px}
.f{min-width:0}
.f label{display:block;font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.3px;margin-bottom:2px}
.f div{font-size:14px;overflow-wrap:anywhere}
.f.wide{grid-column:1/-1}
.est{font-size:10px;font-weight:700;color:#F5C451;background:rgba(245,179,35,.16);border-radius:5px;padding:1px 5px;margin-inline-start:4px}
.src{font-size:11px;color:var(--mute)}
.ev{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.ev li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px}
.ev li b{color:var(--ink)}
.plats{display:flex;flex-wrap:wrap;gap:6px}
.plats a{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 9px;font-size:13px;font-weight:600}
.why{background:var(--card);border-inline-start:3px solid var(--brand);border-radius:8px;padding:8px 12px}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.stbtns{display:flex;gap:6px;flex-wrap:wrap}
.stbtns button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.stbtns button[aria-pressed=true]{color:#fff}
textarea.notes{flex:1;min-width:240px;min-height:64px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;font-size:14px;resize:vertical;background:var(--card)}
textarea.notes:focus,.search:focus,.sel:focus{outline:2px solid var(--brand-ring);border-color:var(--brand)}
.saved{font-size:12px;color:var(--ok);opacity:0;transition:opacity .3s} .saved.on{opacity:1}

/* inspiration */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.site{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column}
.site.pin{grid-column:1/-1;display:grid;grid-template-columns:1.35fr 1fr;border:2px solid var(--brand)}
.shot{display:block;aspect-ratio:16/10;background:#1d1d1d;overflow:hidden;position:relative}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .5s}
.site:hover .shot img{transform:scale(1.03)}
.site .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.site h3{margin:0;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pinb{font-size:11px;font-weight:800;background:var(--brand);color:var(--on-brand);border-radius:999px;padding:2px 9px}
.site p{margin:0;color:var(--ink2);font-size:14px}
.site .note{font-size:12px;color:var(--mute)}
.site .links{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:600;margin-top:auto}
.fav{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--ink2);margin-inline-start:auto}
.fav[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.fav[aria-pressed=true]:hover{background:var(--brand-h);border-color:var(--brand-h)}
.item h3 a{color:var(--ink)}

/* news */
.news{display:grid;gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.item .meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--mute);flex-wrap:wrap}
.item .meta .s{font-weight:700;color:var(--brand-d);background:var(--brand-l);border-radius:6px;padding:1px 8px}
.item h3{margin:6px 0 6px;font-size:17px;line-height:1.35}
.item h3 a{color:var(--ink)} .item h3 a:hover{color:var(--brand-d)}
.item p{margin:0 0 10px;color:var(--ink2);font-size:14px}
.item .wm{background:var(--brand-ll);border:1px solid var(--brand-l);border-radius:12px;padding:9px 12px;font-size:14px}
.item .wm b{color:var(--brand-d)}
.item .ft{display:flex;margin-top:10px}
/* gtm (videos) */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.vid{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;transition:border-color .15s}
.vid:hover{border-color:#3A3A40} .vid.liked{border-color:rgba(22,196,127,.55)}
.thumb{display:block;position:relative;aspect-ratio:16/9;background:#1d1d1d;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.vid:hover .thumb img{transform:scale(1.03)} .vid:hover .thumb .play{opacity:1}
.thumb .play{position:absolute;inset:0;margin:auto;width:50px;height:34px;border-radius:10px;background:rgba(22,196,127,.88);opacity:.85;transition:opacity .2s;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.thumb .dur{position:absolute;bottom:8px;inset-inline-end:8px;background:rgba(0,0,0,.82);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;direction:ltr}
.thumb .appr{position:absolute;top:10px;inset-inline-start:10px;background:rgba(10,10,10,.82);color:var(--ink);border:1px solid rgba(255,255,255,.12);font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;backdrop-filter:blur(6px)}
.vid .body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.vid .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute);flex-wrap:wrap}
.vid .meta .s{font-weight:700;color:var(--brand-d);background:var(--brand-l);border-radius:6px;padding:1px 8px}
.vid h3{margin:0;font-size:16px;line-height:1.4} .vid h3 a{color:var(--ink)} .vid h3 a:hover{color:var(--brand-d)}
/* sitelog */
.slstrip{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:18px 0 14px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);font-size:13px;color:var(--ink2)}
.slstrip b{color:var(--ink)} .slstrip .ok{color:var(--brand);font-weight:700} .slstrip .wait{color:#F5C451;font-weight:700}
.sllist{display:grid;gap:12px}
.slv{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px}
.slv.live{border-color:rgba(22,196,127,.55)}
.slv .meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--mute);flex-wrap:wrap}
.slv .ver{font-weight:800;background:var(--brand);color:var(--on-brand);border-radius:999px;padding:2px 10px;font-size:13px}
.slv .onair{font-weight:800;color:var(--brand);background:var(--brand-l);border-radius:999px;padding:2px 10px;margin-inline-start:auto}
.slv p{margin:0;color:var(--ink);font-size:15px}
.slv .pages{display:flex;flex-wrap:wrap;gap:6px}
.slv .pages span{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;color:var(--ink2);direction:ltr}
.slv .ft{font-size:13px;font-weight:600}
.slhow{margin-top:18px;background:var(--brand-ll);border:1px solid var(--brand-l);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--ink2)}
.slhow b{color:var(--brand-d)} .slhow ol{margin:6px 0 0;padding-inline-start:20px}
.vid .spk{font-size:12px;color:var(--mute);margin-top:-4px}
.vid p{margin:0;color:var(--ink2);font-size:14px}
.vid .wm{background:var(--brand-ll);border:1px solid var(--brand-l);border-radius:12px;padding:9px 12px;font-size:14px}
.vid .wm b{color:var(--brand-d)}
.vid .ft{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:4px;font-size:13px;font-weight:600}
.like{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--ink2);margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px}
.like .h{font-size:15px;line-height:1;color:var(--mute);display:inline-flex}
.hrt{display:inline-block;vertical-align:-.12em;color:var(--brand)}
.like .h .hrt{color:inherit}
.like[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.like[aria-pressed=true]:hover{background:var(--brand-h);border-color:var(--brand-h)}
.like[aria-pressed=true] .h{color:var(--on-brand)}
.man{font-size:13px;font-weight:800;color:#fff;background:#16C47F;border-radius:999px;padding:3px 12px;white-space:nowrap;vertical-align:middle;display:inline-block;line-height:1.4;box-shadow:0 2px 10px rgba(22,196,127,.35)}
.who b .man{margin-inline-start:8px}
.manual,.manual:hover{border:2.5px solid #16C47F!important;box-shadow:0 0 0 4px rgba(22,196,127,.14),0 10px 30px rgba(22,196,127,.18)!important}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:5px;margin:18px 0 0}
.seg button{border:0;background:transparent;color:var(--ink2);font-weight:700;font-size:16px;padding:10px 22px;border-radius:12px;white-space:nowrap}
.seg button:hover{color:var(--ink);background:var(--line)}
.seg button[aria-pressed=true]{background:#16C47F;color:#fff}
.seg button[aria-pressed=true]:hover{background:var(--brand-h)}
.vidbox{margin-top:2px}
.vidbox summary{cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--brand-d);background:var(--brand-l);border:1px solid var(--brand-ring);border-radius:999px;padding:4px 12px;list-style:none}
.vidbox summary::-webkit-details-marker{display:none}
.vidbox video{display:block;margin-top:10px;max-width:100%;max-height:520px;border-radius:12px;border:1px solid var(--line);background:#000}
.mangroup h2{color:var(--brand-d)}
.empty{padding:40px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
footer{color:var(--mute);font-size:12px;padding:30px 16px max(50px,calc(env(safe-area-inset-bottom) + 24px));text-align:center}

/* responsive */
html,body{overflow-x:hidden;max-width:100%}
.list,.news,.sllist{grid-template-columns:minmax(0,1fr)}
.cmail{overflow-wrap:anywhere;word-break:break-word}
.cmail span,.cmail a{min-width:0;overflow-wrap:anywhere}
@media (max-width:980px){
  .row{grid-template-columns:44px minmax(0,1fr) auto auto 20px}
  .row .niche,.row .stcell{display:none}
  .dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .site.pin{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .wrap{padding:0 12px}
  .top .wrap{flex-wrap:wrap;height:auto;padding-top:8px;padding-bottom:8px;gap:8px}
  .brand .sub{display:none}
  .sync{margin-inline-start:auto;font-size:11px}
  nav.tabs{order:3;width:100%;margin:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:3px;border-radius:14px}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{flex-direction:column;justify-content:center;align-items:center;padding:6px 2px;gap:2px;font-size:11.5px;border-radius:10px;line-height:1.15;min-width:0}
  nav.tabs button .n{min-width:0;padding:1px 5px;font-size:10px;line-height:1.2}
  .hero{padding:14px 0 4px}
  .hero h1{font-size:21px;line-height:1.25}
  .hero p{font-size:13.5px;line-height:1.45}
  .seg{display:flex;width:100%;gap:4px;padding:4px;margin:12px 0 8px;border-radius:12px}
  .seg button{flex:1;justify-content:center;text-align:center;font-size:13px;padding:8px 6px;border-radius:9px;min-width:0}
  .cfil{padding:8px;gap:5px;margin-bottom:8px}
  .cfil .lbl{width:100%;font-size:12px;margin-bottom:2px}
  .cfil .chip,.filters .chip{font-size:12px;padding:5px 9px;gap:4px}
  .filters{padding:10px;gap:7px;margin:10px 0 6px}
  .filters .chips{width:100%}
  .filters .sep{display:none}
  .sel{flex:1 1 calc(50% - 4px);min-width:0;font-size:14px;padding:7px 8px}
  .search{min-width:0;width:100%;flex-basis:100%;font-size:16px;padding:8px 10px}
  .count{margin:0;font-size:12px;margin-inline-end:auto}
  .expbtn{font-size:12px;padding:6px 12px}
  .row{grid-template-columns:38px minmax(0,1fr) auto 16px;gap:8px;padding:10px 12px}
  .row .fitcell{display:none}
  .who b{white-space:normal;display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:14px;line-height:1.3}
  .who b .man{margin-inline-start:0;font-size:10.5px;padding:1px 7px}
  .who small{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who .mst{display:flex;flex-wrap:wrap}
  .fol{font-size:13.5px}
  .av{width:38px;height:38px;font-size:15px;border-radius:10px}
  .cmail{padding:0 12px 8px;font-size:12px;gap:6px}
  .det{padding:12px}
  .dgrid{grid-template-columns:minmax(0,1fr);gap:10px}
  .grid,.vgrid{grid-template-columns:minmax(0,1fr);gap:14px}
  .site .body,.vid .body,.item,.slv{padding:12px 14px}
  .site h3{font-size:16px}
  .man{font-size:11px;padding:2px 8px}
  .slstrip{padding:10px 12px;gap:6px 12px;font-size:12px}
  textarea.notes{min-width:0;width:100%;font-size:16px}
}
</style>
</head>

  <div class="wrap">
    <div class="brand"><span dir="ltr" style="display:inline-flex;align-items:center;gap:8px;direction:ltr;unicode-bidi:isolate"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="26" height="26" role="img" aria-label="Klober" style="display:block;flex-shrink:0"><rect width="64" height="64" rx="16" fill="#16C47F"/><path d="M18 16H26.5V29.2L38.2 16H48.2L34.8 30.8L49 48H39.2L29.1 35.4L26.5 38.2V48H18V16Z" fill="#0A0A0A"/></svg><span style="color:#16C47F;font-weight:800;font-size:21px;letter-spacing:-0.4px;line-height:1">Klober</span></span><span class="sub">CRM · צמיחה</span></div>

<main class="wrap" id="app"></main>
<footer>Klober CRM · v1.1 · הנתונים נאספו ממקורות ציבוריים; שדה ריק = לא ידוע (לא נוחש)</footer>

<div class="shmodal-bg" id="shmodal-bg" role="dialog" aria-modal="true" aria-labelledby="shmodal-title">

<script>
/* ===================== State module (easy to rewire) =====================
   Shared server (see crm-shell INTEGRATION.md): RELATIVE `api/state` (page under /bamp/ → ws=bamp).
   Format: {entries:{"bamp-<kind>-v1":{"<itemId>":{v:{status,notes,fav,like},t:<ms>,d?:1}}}}, last-write-wins by t.
   We only PUT what changed. Offline/failed → localStorage (keys prefixed "bamp-"). Optional ?syncns=test-x for tests. */
const BampState = (() => {
  const ns = new URLSearchParams(location.search).get('syncns');
  const URL_ = 'api/state' + (ns ? '?ns=' + encodeURIComponent(ns) : '');
  const SEED_URL = 'state.json';
  let staticOnly = /\.github\.io$/i.test(location.hostname);
  const KEY = kind => 'bamp-' + kind + '-v1';
  const LS = 'bamp-crm-entries-v1', LSP = 'bamp-crm-pending-v1';
  const read = k => { try { return JSON.parse(localStorage.getItem(k) || '{}') || {}; } catch (e) { return {}; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let entries = read(LS), pending = read(LSP), mode = staticOnly ? 'ghpages' : 'local', timer = null, modeL = [], changeL = [];
  const setMode = m => { mode = m; modeL.forEach(f => f(m)); };
  function merge(remote) {
    let changed = false;
    for (const k of Object.keys(remote || {})) {
      if (!/^bamp-/.test(k)) continue;
      const loc = entries[k] = entries[k] || {};
      for (const id of Object.keys(remote[k] || {})) {
        const r = remote[k][id], l = loc[id], p = pending[k] && pending[k][id];
        if (p && p.t > (r.t || 0)) continue;              // our unsent edit is newer
        if (!l || (r.t || 0) > (l.t || 0)) { loc[id] = r; changed = true; }
      }
    }
    write(LS, entries);
    if (changed) changeL.forEach(f => f());
  }
  async function pullSeed() {
    try {
      const r = await fetch(SEED_URL, { cache: 'no-cache', headers: { Accept: 'application/json' } });
      if (r.ok) {
        const j = await r.json();
        if (j && typeof j.entries === 'object') merge(j.entries);
      }
    } catch (e) {}
    setMode('ghpages');
  }
  async function pull() {
    if (staticOnly) return pullSeed();
    try {
      const r = await fetch(URL_, { cache: 'no-store', headers: { Accept: 'application/json' } });
      if (r.status === 404) { staticOnly = true; return pullSeed(); }
      if (!r.ok || !(r.headers.get('content-type') || '').includes('json')) throw 0;
      const j = await r.json(); if (!j || typeof j.entries !== 'object') throw 0;
      setMode('server'); merge(j.entries);
      if (Object.keys(pending).length) push();
    } catch (e) { setMode('local'); }
  }
  async function push(keepalive) {
    if (staticOnly) { setMode('ghpages'); return; }
    const sent = pending; if (!Object.keys(sent).length) return;
    try {
      const r = await fetch(URL_, { method: 'PUT', keepalive: !!keepalive, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ entries: sent }) });
      if (!r.ok) throw 0;
      for (const k of Object.keys(sent)) for (const id of Object.keys(sent[k])) {
        if (pending[k] && pending[k][id] && pending[k][id].t === sent[k][id].t) delete pending[k][id];
        if (pending[k] && !Object.keys(pending[k]).length) delete pending[k];
      }
      write(LSP, pending); setMode('server');
      const j = await r.json().catch(() => null); if (j && j.entries) merge(j.entries);
    } catch (e) { setMode('local'); }
  }
  function get(kind, id) { const e = entries[KEY(kind)] && entries[KEY(kind)][id]; return e && !e.d && e.v ? e.v : {}; }
  function set(kind, id, patch) {
    const k = KEY(kind), rec = { v: Object.assign({}, get(kind, id), patch), t: Date.now() };
    (entries[k] = entries[k] || {})[id] = rec; (pending[k] = pending[k] || {})[id] = rec;
    write(LS, entries); write(LSP, pending);
    clearTimeout(timer); timer = setTimeout(push, 500);
  }
  function start() {
    setInterval(() => { if (!staticOnly && document.visibilityState === 'visible') pull(); }, 5000);
    addEventListener('focus', pull); addEventListener('online', pull);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); else push(true); });
    addEventListener('pagehide', () => push(true));
    return pull();
  }
  return { start, pull, get, set, onMode: f => modeL.push(f), onChange: f => changeL.push(f), get mode() { return mode; } };
})();

/* ===================== UI prefs (localStorage, bamp- prefix) ===================== */
const Prefs = {
  key: 'bamp-ui-v1',
  get() { try { return JSON.parse(localStorage.getItem(this.key) || '{}'); } catch (e) { return {}; } },
  set(p) { try { localStorage.setItem(this.key, JSON.stringify(Object.assign(this.get(), p))); } catch (e) {} }
};

/* ===================== helpers ===================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ltr = s => `<bdi class="ltr" dir="ltr">${esc(s)}</bdi>`;
const cBucket = i => i.contactEmail ? 'email' : (i.contactOther || i.linkInBio) ? 'other' : 'none';
const otherLink = o => { if (!o) return ''; const m = String(o).match(/^(.*?)(https?:\/\/\S+)\s*$/); return m ? `${esc(m[1].replace(/[:\s]+$/, ''))} ${link(m[2])}` : esc(o); };
const link = (u, t) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${t || ltr(u.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''))}</a>` : '';
const contact = c => { if (!c) return ''; const m = String(c).match(/^\s*([^\s@]+@[^\s]+)\s*(.*)$/);
  if (!m) return esc(c); return `<a href="mailto:${esc(m[1])}">${ltr(m[1])}</a>${m[2] ? ` <div class="src">${esc(m[2].replace(/^\(|\)$/g, ''))}</div>` : ''}`; };
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const fmtDate = d => { if (!d) return ''; const [y, m, dd] = d.split('-').map(Number); return `${dd} ב${MONTHS[m - 1]} ${y}`; };
const fmtK = n => n == null || n === '' ? '—' : n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K' : String(n);
const groupBy = (arr, f) => arr.reduce((m, x) => { (m[f(x)] = m[f(x)] || []).push(x); return m; }, {});
const STATUSES = [
  { id: 'new', label: 'חדש', color: '#4C8DFF' },
  { id: 'interesting', label: 'מעניין', color: '#22C55E' },

];

/* ===================== data ===================== */
const DATA = { influencers: [], inspiration: [], news: [], gtm: [], sitelog: [] };
const TABS = ['influencers', 'inspiration', 'news', 'gtm', 'sitelog'];
function mergeCustomItems() {
  for (const k of ['gtm', 'influencers', 'inspiration', 'news']) {
    const customMap = BampState.get('custom', k) || {};
    const items = Object.values(customMap).filter(x => x && x.id);
    if (!items.length) continue;
    const existingIds = new Set(DATA[k].map(x => x.id));
    const existingUrls = new Set(DATA[k].map(x => (x.url || x.instagramUrl || '').replace(/\/?$/, '')));
    for (const it of items) {
      const u = (it.url || it.instagramUrl || '').replace(/\/?$/, '');
      if (!existingIds.has(it.id) && (!u || !existingUrls.has(u))) {
        DATA[k].unshift(it);
        existingIds.add(it.id);
        if (u) existingUrls.add(u);
      }
    }
    const nEl = $('#n-' + k);
    if (nEl) nEl.textContent = DATA[k].length;
  }
}
async function loadData() {
  await Promise.all(Object.keys(DATA).map(async k => {
    try { let r = await fetch(`${k}.json`, { cache: 'no-store' }); if (!r.ok) r = await fetch(`data/${k}.json`, { cache: 'no-store' }); DATA[k] = r.ok ? await r.json() : []; } catch (e) { DATA[k] = []; }
    $('#n-' + k).textContent = DATA[k].length;
  }));
  mergeCustomItems();
}

/* ===================== manual upload filter =====================
   Any item in any data/*.json with "manualUpload": true (optional "uploadedBy") is treated as manual.
   Missing field = collected automatically. Filter state is per tab: UI.man[tab]. */
const isManual = x => !!(x && x.manualUpload === true);
/* label: "(בר ורועי)" inside uploadedBy wins; a specific name is shown as-is; generic/missing → בר ורועי */
const manBy = x => { const u = String(x.uploadedBy || '').trim(), m = u.match(/\(([^)]+)\)/);
  return m ? m[1].trim() : (u && !/^צ[׳']?אט משותף/.test(u) ? u : 'בר ורועי'); };
const manBadge = x => isManual(x) ? `<span class="man" title="${esc('הועלה ידנית' + (x.uploadedBy ? ' · ' + x.uploadedBy : ''))}">✋ הועלה ע״י ${esc(manBy(x))}</span>` : '';
const manCls = x => isManual(x) ? 'manual' : '';
const srcMode = () => { const m = UI.src && UI.src[UI.tab]; return m === 'bot' || m === 'ours' ? m : 'all'; };
const srcOk = x => srcMode() === 'all' || (srcMode() === 'ours') === isManual(x);
const manOn = () => srcMode() === 'ours';
const manFirst = (arr, cmp) => arr.slice().sort((a, b) => (isManual(b) - isManual(a)) || (cmp ? cmp(a, b) : 0));
const srcToggle = kind => { const all = DATA[kind], o = all.filter(isManual).length, m = srcMode();
  return `<div class="seg" role="group" aria-label="מקור">${[['all', `הכול (${all.length})`], ['bot', `Grok (${all.length - o})`], ['ours', `✋ ידני (${o})`]]
    .map(([v, t]) => `<button data-f="src" data-v="${v}" aria-pressed="${m === v}">${t}</button>`).join('')}</div>`; };
const manSection = (items, card, wrap) => items.length ? `<section class="group mangroup"><h2>✋ ידני <span class="b">${items.length}</span></h2><div class="${wrap}">${items.map(card).join('')}</div></section>` : '';
const MAN_EMPTY = '<div class="empty">אין כרגע פריטים שהועלו ידנית בלשונית הזו 🙂<br>פריטים שיתווספו ידנית יופיעו כאן.</div>';

/* ===================== views ===================== */
const UI = Object.assign({ tab: 'influencers', st: 'all', range: 'all', aff: false, q: '', sort: 'fit', gtmf: 'all', cf: 'all' }, Prefs.get(), { open: null });
if (!UI.src || typeof UI.src !== 'object') UI.src = {};
if (UI.man && typeof UI.man === 'object') { for (const t of Object.keys(UI.man)) if (UI.man[t] && !UI.src[t]) UI.src[t] = 'ours'; delete UI.man; }
if (!TABS.includes(UI.tab)) UI.tab = 'influencers';

function infFiltered() {
  const q = UI.q.trim().toLowerCase();
  const ranges = { a: [0, 50000], b: [50000, 100000], c: [100000, 1e12] };
  return DATA.influencers.filter(i => {
    const s = BampState.get('influencers', i.id).status || 'new';
    if (UI.st !== 'all' && s !== UI.st) return false;
    if (UI.range !== 'all') { const [lo, hi] = ranges[UI.range]; if (!(i.followers >= lo && i.followers < hi)) return false; }
    if (UI.aff && !i.hasAffiliate) return false;
    if (UI.cf && UI.cf !== 'all' && cBucket(i) !== UI.cf) return false;
    if (!srcOk(i)) return false;
    if (q && !(`${i.name} ${i.handle} ${i.niche} ${i.location}`.toLowerCase().includes(q))) return false;
    return true;
  });
}

    </button>
    ${i.contactEmail || i.contactOther ? `<div class="cmail">${i.contactEmail ? `<a href="mailto:${esc(i.contactEmail)}">📧 ${ltr(i.contactEmail)}</a>` : ''}${!i.contactEmail && i.contactOther ? `<span>🔗 ${otherLink(i.contactOther)}</span>` : ''}</div>` : ''}

/* GTM: verified YouTube videos & Instagram Reels; like = BampState 'gtm' (key bamp-gtm-v1, sub-key = item id) */
function viewGtm() {
  const liked = v => !!BampState.get('gtm', v.id).like;
  const isIg = v => v.platform === 'instagram' || /instagram\.com\/(reel|p)\//.test(v.url || '');
  const nLiked = DATA.gtm.filter(liked).length;
  const list = DATA.gtm.filter(v => (UI.gtmf !== 'liked' || liked(v)) && srcOk(v));
  const card = v => { const on = liked(v), ig = isIg(v), watchLbl = ig ? 'לצפייה בריל באינסטגרם ↗' : 'לצפייה ביוטיוב ↗';
    return `<article class="vid ${ig ? 'igreel' : ''} ${on ? 'liked' : ''} ${manCls(v)}" data-id="${esc(v.id)}">
      <a class="thumb" href="${esc(v.url)}" target="_blank" rel="noopener noreferrer" aria-label="${ig ? 'צפייה באינסטגרם' : 'צפייה ביוטיוב'}: ${esc(v.title)}">
        ${v.thumbnail ? `<img loading="lazy" src="${esc(v.thumbnail)}" alt="">` : `<div class="igph"><span>Instagram Reel</span></div>`}
        <span class="play"><svg width="22" height="22" viewBox="0 0 24 24" fill="#04140D"><path d="M8 5v14l11-7z"/></svg></span>
        ${v.duration ? `<span class="dur">${esc(v.duration)}</span>` : (ig ? `<span class="dur">Reel</span>` : '')}
        ${v.approach ? `<span class="appr">${esc(v.approach)}</span>` : ''}
      </a>
      <div class="body">
        <div class="meta"><span class="s">${ltr(v.channel)}</span>${v.publishDate ? `<span>פורסם ${fmtDate(v.publishDate)}</span>` : ''}${manBadge(v)}</div>
        <h3>${link(v.url, `<bdi>${esc(v.title)}</bdi>`)}</h3>
        ${v.speaker ? `<div class="spk"><bdi>${esc(v.speaker)}</bdi></div>` : ''}
        ${v.summary ? `<p>${esc(v.summary)}</p>` : ''}
        ${v.takeaway ? `<div class="wm"><b>מה לקחת ל-Klober:</b> ${esc(v.takeaway)}</div>` : ''}
        <div class="ft">${link(v.url, watchLbl)}<button class="like" data-like aria-pressed="${on}" aria-label="${on ? 'הסר מהשמורים' : 'שמור (לייק)'}"><span class="h"><svg class="hrt" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M12 21.2s-7.6-4.7-10.1-9.6C.3 8.3 2.4 4.3 6.3 4.3c2.3 0 3.9 1.3 5.7 3.4 1.8-2.1 3.4-3.4 5.7-3.4 3.9 0 6 4 4.4 7.3-2.5 4.9-10.1 9.6-10.1 9.6z"/></svg></span>${on ? 'שמור' : 'לייק'}</button></div>
      </div></article>`; };
  const groups = groupBy(list.filter(v => !isManual(v)), v => v.dateAdded);
  return `<section class="hero"><h1>GTM · <em>איך מתחילים את ההשקה</em></h1>
      <p>סרטונים נבחרים (מאומתים: כותרת, ערוץ, תאריך ואורך) על הדרך הנכונה להתחיל go-to-market לסטארטאפ AI / כלי פיתוח בשלב מוקדם — לקוחות ראשונים, אסטרטגיית השקה, צמיחה מוצרית, קהילה ויוצרי תוכן, ומקרי בוחן. סמנו ${HEART} את מה ששווה לחזור אליו.</p></section>
    ${srcToggle('gtm')}
    <div class="filters">
      <div class="chips" role="group" aria-label="סינון">
        <button class="chip" data-f="gtmf" data-v="all" aria-pressed="${UI.gtmf !== 'liked'}">הכל · ${DATA.gtm.length}</button>
        <button class="chip" data-f="gtmf" data-v="liked" aria-pressed="${UI.gtmf === 'liked'}">${HEART} שמורים בלבד · ${nLiked}</button>
      </div>
      <span class="count">${list.length} מתוך ${DATA.gtm.length}</span>
    </div>
    ${list.length ? manSection(list.filter(isManual), card, 'vgrid') + Object.keys(groups).sort().reverse().map(d => `<section class="group"><h2>נוסף ב-${fmtDate(d)} <span class="b">${groups[d].length}</span></h2>
      <div class="vgrid">${groups[d].map(card).join('')}</div></section>`).join('') : manOn() ? MAN_EMPTY : `<div class="empty">${UI.gtmf === 'liked' ? 'עדיין אין סרטונים שמורים — לחצו ' + HEART + ' על סרטון כדי לשמור אותו' : 'אין סרטונים עדיין'}</div>`}`;
}

function render() {
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === UI.tab));
  const app = $('#app');
  app.innerHTML = UI.tab === 'inspiration' ? viewInspiration() : UI.tab === 'news' ? viewNews() : UI.tab === 'gtm' ? viewGtm() : UI.tab === 'sitelog' ? viewSitelog() : viewInfluencers();
}

/* ===================== events ===================== */
document.querySelector('nav.tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  UI.tab = b.dataset.tab; Prefs.set({ tab: UI.tab }); if (location.hash !== '#' + UI.tab) history.replaceState(null, '', '#' + UI.tab);
  render(); window.scrollTo({ top: 0 });
});
$('#app').addEventListener('click', e => {
  const f = e.target.closest('[data-f]');
  if (f && f.tagName === 'BUTTON') {
    if (f.dataset.f === 'st') UI.st = f.dataset.v; else if (f.dataset.f === 'aff') UI.aff = !UI.aff; else if (f.dataset.f === 'gtmf') UI.gtmf = f.dataset.v; else if (f.dataset.f === 'cf') UI.cf = f.dataset.v;
    else if (f.dataset.f === 'src') UI.src = Object.assign({}, UI.src, { [UI.tab]: f.dataset.v });
    Prefs.set({ st: UI.st, aff: UI.aff, cf: UI.cf, gtmf: UI.gtmf, src: UI.src, man: undefined }); render(); return;
  }
  const row = e.target.closest('.row');
  if (row) { const id = row.closest('.card').dataset.id; UI.open = UI.open === id ? null : id; render();
    const el = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`); if (el && UI.open) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return; }
  const sb = e.target.closest('.stbtns button');
  if (sb) { const id = sb.closest('.card').dataset.id; BampState.set('influencers', id, { status: sb.dataset.st }); render(); return; }
  const fav = e.target.closest('[data-fav]');
  if (fav) { const card = fav.closest('[data-id]'); const kind = UI.tab; const cur = !!BampState.get(kind, card.dataset.id).fav;
    BampState.set(kind, card.dataset.id, { fav: !cur }); render(); return; }
  const like = e.target.closest('[data-like]');
  if (like) { const id = like.closest('[data-id]').dataset.id; const cur = !!BampState.get('gtm', id).like;
    BampState.set('gtm', id, { like: !cur }); render(); }
});
$('#app').addEventListener('change', e => {
  const f = e.target.closest('select[data-f]'); if (!f) return;
  UI[f.dataset.f] = f.value; Prefs.set({ [f.dataset.f]: f.value }); render();
});
let qTimer;
$('#app').addEventListener('input', e => {
  if (e.target.matches('input[data-f=q]')) {
    clearTimeout(qTimer); const v = e.target.value;
    qTimer = setTimeout(() => { UI.q = v; render(); const s = $('input[data-f=q]'); s.focus(); s.setSelectionRange(v.length, v.length); }, 200);
  }
  if (e.target.matches('textarea.notes')) {
    const card = e.target.closest('.card'); BampState.set('influencers', card.dataset.id, { notes: e.target.value });
    const sv = $('.saved', card); sv.classList.add('on'); clearTimeout(sv._t); sv._t = setTimeout(() => sv.classList.remove('on'), 1200);
  }
});
function csvCell(v) {
  const s = String(v == null ? '' : v).replace(/\r?\n/g, ' ').trim();
  return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportInfluencersCSV() {
  const today = new Date().toISOString().slice(0, 10);
  const list = infFiltered();
  const headers = ['שם', 'Handle', 'קישור אינסטגרם', 'עוקבים', 'מיקום', 'ציון התאמה', 'נישה', 'אימייל', 'אמצעי קשר אחר', 'לינק ב-Bio', 'שת״פ / אפיליאייט', 'סטטוס', 'הערות אישיות', 'תאריך הוספה', 'למה מתאים ל-Klober'];
  const rows = list.map(i => {
    const s = BampState.get('influencers', i.id), st = stOf(s.status);
    return [i.name, i.handle, i.instagramUrl, i.followers, i.location, i.fitScore, i.niche, i.contactEmail, i.contactOther, i.linkInBio, i.hasAffiliate ? 'כן' : 'לא', st.label, s.notes || '', i.dateAdded, i.whyFit];
  });
  const lines = [headers.map(csvCell).join(','), ...rows.map(r => r.map(csvCell).join(','))];
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `klober-influencers-${today}.csv`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 250);
}
$('#app').addEventListener('click', e => { if (e.target.closest('[data-export="influencers"]')) exportInfluencersCSV(); });
BampState.onMode(mode => { const s = $('#sync'); s.className = 'sync ' + mode; $('span', s).textContent = mode === 'server' ? 'מסונכרן לשרת' : mode === 'ghpages' ? 'מסונכרן · GitHub Pages' : 'שמירה מקומית'; });
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS.includes(t)) { UI.tab = t; render(); } });

function openShareModal(prefillUrl = '', prefillTitle = '', prefillTab = '') {
  const bg = $('#shmodal-bg');
  const cleanUrl = (prefillUrl.match(/https?:\/\/\S+/) || [prefillUrl])[0].trim();
  $('#sh-url').value = cleanUrl;
  $('#sh-title').value = prefillTitle || '';
  $('#sh-note').value = '';
  if (prefillTab && ['gtm', 'influencers', 'inspiration', 'news'].includes(prefillTab)) {
    $('#sh-tab').value = prefillTab;
  } else if (/instagram\.com\/(reel|p)\/|youtube\.com|youtu\.be|tiktok\.com/i.test(cleanUrl)) {
    $('#sh-tab').value = 'gtm';
  } else if (/instagram\.com\/[A-Za-z0-9_.]+\/?$/i.test(cleanUrl)) {
    $('#sh-tab').value = 'influencers';
  } else if (['gtm', 'influencers', 'inspiration', 'news'].includes(UI.tab)) {
    $('#sh-tab').value = UI.tab;
  }
  bg.classList.add('open');
}
function closeShareModal() { $('#shmodal-bg').classList.remove('open'); }
$('#btn-open-add').addEventListener('click', () => openShareModal());
$('#shmodal-close').addEventListener('click', closeShareModal);
$('#shmodal-cancel').addEventListener('click', closeShareModal);
$('#shmodal-bg').addEventListener('click', e => { if (e.target.id === 'shmodal-bg') closeShareModal(); });
$('#shmodal-form').addEventListener('submit', e => {
  e.preventDefault();
  const rawUrl = $('#sh-url').value.trim();
  if (!rawUrl) return;
  const tab = $('#sh-tab').value;
  const titleIn = $('#sh-title').value.trim();
  const noteIn = $('#sh-note').value.trim();
  const today = new Date().toISOString().slice(0, 10);
  const id = 'manual-' + Date.now();
  let item;
  if (tab === 'gtm') {
    const igMatch = rawUrl.match(/instagram\.com\/(?:reel|p)\/([A-Za-z0-9_-]+)/i);
    const clean = igMatch ? `https://www.instagram.com/reel/${igMatch[1]}/` : rawUrl;
    item = {
      id: igMatch ? igMatch[1] : id,
      title: titleIn || (igMatch ? `Instagram Reel (${igMatch[1]})` : clean),
      channel: igMatch ? 'Instagram Reel' : new URL(clean).hostname.replace(/^www\./, ''),
      url: clean,
      platform: igMatch ? 'instagram' : 'web',
      duration: igMatch ? 'Reel' : '',
      approach: 'הועלה מהנייד',
      summary: noteIn || 'שותף ישירות מהטלפון ל-Klober CRM.',
      takeaway: noteIn || '',
      dateAdded: today,
      manualUpload: true,
      uploadedBy: 'בר ורועי'
    };
  } else if (tab === 'influencers') {
    const hMatch = rawUrl.match(/instagram\.com\/([A-Za-z0-9_.]+)/i);
    const handle = hMatch && !['reel', 'p', 'stories'].includes(hMatch[1].toLowerCase()) ? '@' + hMatch[1] : (titleIn || '@creator');
    item = {
      id,
      name: titleIn || handle.replace(/^@/, ''),
      handle,
      instagramUrl: rawUrl,
      followers: null,
      location: '',
      fitScore: 9,
      niche: 'טק / AI',
      whyFit: noteIn || 'שותף ידנית מהטלפון.',
      dateAdded: today,
      manualUpload: true,
      uploadedBy: 'בר ורועי'
    };
  } else if (tab === 'inspiration') {
    item = {
      id,
      name: titleIn || new URL(rawUrl).hostname.replace(/^www\./, ''),
      url: rawUrl,
      screenshot: '',
      whySpecial: noteIn || 'שותף ידנית מהטלפון.',
      dateAdded: today,
      manualUpload: true,
      uploadedBy: 'בר ורועי'
    };
  } else {
    item = {
      id,
      title: titleIn || rawUrl,
      source: new URL(rawUrl).hostname.replace(/^www\./, ''),
      url: rawUrl,
      date: today,
      dateAdded: today,
      summary: noteIn || 'שותף ידנית מהטלפון.',
      whyMatters: noteIn || 'שותף ידנית מהטלפון.',
      manualUpload: true,
      uploadedBy: 'בר ורועי'
    };
  }
  const curMap = Object.assign({}, BampState.get('custom', tab));
  curMap[item.id] = item;
  BampState.set('custom', tab, curMap);
  mergeCustomItems();
  UI.tab = tab;
  UI.src = Object.assign({}, UI.src, { [tab]: 'ours' });
  Prefs.set({ tab: UI.tab, src: UI.src });
  closeShareModal();
  render();
});

(async () => {
  const h = location.hash.slice(1); if (TABS.includes(h)) UI.tab = h;
  await Promise.all([loadData(), BampState.start()]);
  mergeCustomItems();
  render();
  const qp = new URLSearchParams(location.search);
  const sharedUrl = qp.get('add') || qp.get('url') || qp.get('text') || '';
  const sharedTitle = qp.get('title') || '';
  const sharedTab = qp.get('tab') || '';
  if (sharedUrl) {
    history.replaceState(null, '', location.pathname + location.hash);
    openShareModal(sharedUrl, sharedTitle, sharedTab);
  }
  BampState.onChange(() => { const a = document.activeElement; if (a && a.matches('textarea, input')) return; render(); });
})();
</script>
</body>
</html>
